{{- if .Values.eventSink.auth.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "mcp-event-sink-auth" }}
{{- $ingestToken := randAlphaNum 48 }}
{{- $queryToken := randAlphaNum 48 }}
{{- if $existing }}
{{- $ingestToken = index $existing.data "EVENT_SINK_INGEST_TOKEN" | b64dec }}
{{- $queryToken = index $existing.data "EVENT_SINK_QUERY_TOKEN" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: mcp-event-sink-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-event-sink
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  EVENT_SINK_INGEST_TOKEN: {{ $ingestToken | quote }}
  EVENT_SINK_QUERY_TOKEN: {{ $queryToken | quote }}
  WEBHOOK_CUSTOMHEADERS: {{ printf "Authorization:Bearer %s" $ingestToken | quote }}
{{- end }}
