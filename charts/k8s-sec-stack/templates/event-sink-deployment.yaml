apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-event-sink
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-event-sink
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-event-sink
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-event-sink
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sink
          image: "{{ .Values.eventSink.image.repository }}{{- if .Values.eventSink.image.digest }}@{{ .Values.eventSink.image.digest }}{{- else }}:{{ .Values.eventSink.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.eventSink.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: EVENT_SINK_DB_PATH
              value: /data/events.db
            - name: EVENT_SINK_RETENTION_DAYS
              value: {{ .Values.eventSink.retentionDays | int | quote }}
            - name: EVENT_SINK_STORE_RAW_EVENTS
              value: {{ .Values.eventSink.storeRawEvents | quote }}
            - name: EVENT_SINK_REDACTED_FIELDS
              value: {{ join "," .Values.eventSink.redactedFields | quote }}
            - name: EVENT_SINK_MAX_BODY_BYTES
              value: {{ .Values.eventSink.limits.maxBodyBytes | int | quote }}
            - name: EVENT_SINK_MAX_SNAPSHOT_BATCH
              value: {{ .Values.eventSink.limits.maxSnapshotBatch | int | quote }}
            - name: EVENT_SINK_MAX_QUERY_LIMIT
              value: {{ .Values.eventSink.limits.maxQueryLimit | int | quote }}
            - name: EVENT_SINK_MAX_QUERY_HOURS
              value: {{ .Values.eventSink.limits.maxQueryHours | int | quote }}
            - name: EVENT_SINK_MAX_QUERY_DAYS
              value: {{ .Values.eventSink.limits.maxQueryDays | int | quote }}
            - name: EVENT_SINK_MAX_TREND_RECORDS
              value: {{ .Values.eventSink.limits.maxTrendRecords | int | quote }}
            - name: EVENT_SINK_MAX_RESPONSE_BYTES
              value: {{ .Values.eventSink.limits.maxResponseBytes | int | quote }}
            - name: EVENT_SINK_MAX_CONCURRENT_REQUESTS
              value: {{ .Values.eventSink.limits.maxConcurrentRequests | int | quote }}
            - name: EVENT_SINK_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-event-sink-auth
                  key: EVENT_SINK_INGEST_TOKEN
            - name: EVENT_SINK_QUERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-event-sink-auth
                  key: EVENT_SINK_QUERY_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcp-event-sink-data
