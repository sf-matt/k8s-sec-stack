{{- $kubescape := index .Values "kubescape-operator" }}
{{- if $kubescape.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $kubescape.ksNamespace | default "kubescape" }}
  labels:
    kubernetes.io/metadata.name: {{ $kubescape.ksNamespace | default "kubescape" }}
    app.kubernetes.io/part-of: {{ .Chart.Name }}
{{- end }}
