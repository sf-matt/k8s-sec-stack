apiVersion: batch/v1
kind: CronJob
metadata:
  name: posture-snapshot
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: posture-snapshot
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: posture-snapshot
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: posture-snapshot
          restartPolicy: OnFailure
          containers:
            - name: snapshot
              image: python:3.12-slim
              command: ["python", "/app/snapshot.py"]
              env:
                - name: FALCO_SINK_URL
                  value: "http://mcp-event-sink:8080"
                - name: EVENT_SINK_INGEST_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mcp-event-sink-auth
                      key: EVENT_SINK_INGEST_TOKEN
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /app
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: posture-snapshot-script
