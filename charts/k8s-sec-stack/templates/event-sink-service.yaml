apiVersion: v1
kind: Service
metadata:
  name: mcp-event-sink
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.eventSink.service.type }}
  selector:
    app.kubernetes.io/name: mcp-event-sink
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
      {{- if and (eq .Values.eventSink.service.type "NodePort") .Values.eventSink.service.nodePort }}
      nodePort: {{ .Values.eventSink.service.nodePort }}
      {{- end }}
