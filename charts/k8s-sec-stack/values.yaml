# Global toggles — flip any to false to exclude from the install
falco:
  enabled: true
  driver:
    kind: modern_ebpf
  falco:
    json_output: true
    json_include_output_fields_property: true
    http_output:
      enabled: true
      url: "http://falcosidekick:2801"
    grpc:
      enabled: false
    grpc_output:
      enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

falcosidekick:
  enabled: true
  # Stable same-namespace discovery avoids coupling Falco to the Helm release name.
  fullnameOverride: falcosidekick
  service:
    type: ClusterIP
  config:
    # The generated event-sink Secret supplies WEBHOOK_CUSTOMHEADERS.
    existingSecret: mcp-event-sink-auth
    webhook:
      address: "http://mcp-event-sink:8080/events"
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

trivyOperator:
  enabled: true
  trivy:
    severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  operator:
    scanJobsConcurrentLimit: 2
    # Keep reports for 7 days — default 24h is too short for dev
    scannerReportTTL: "168h"
    configAuditScannerEnabled: true
    rbacAssessmentScannerEnabled: true
    infraAssessmentScannerEnabled: true
    exposedSecretScannerEnabled: true
    sbomGenerationEnabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubescapeOperator:
  enabled: true
  clusterName: "local-dev"
  capabilities:
    continuousScan: enable
  # Reduced for single-node dev cluster
  kubevuln:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1500Mi
  kubescape:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  storage:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

eventSink:
  image:
    repository: ghcr.io/sf-matt/k8s-sec-event-sink
    tag: "0.1.0"
    # Public multi-platform manifest produced by Event sink image run 33358389880.
    # The tag remains for discovery; Helm releases use this immutable digest.
    digest: "sha256:ecd8cf86a6284ccaed6a9ee63c363f0d04fa01b65e43c327af01b9a576131479"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    nodePort: null
  auth:
    # Set false only when an operator-managed Secret named mcp-event-sink-auth
    # already supplies EVENT_SINK_INGEST_TOKEN, EVENT_SINK_QUERY_TOKEN, and
    # WEBHOOK_CUSTOMHEADERS. Authentication itself cannot be disabled by Helm.
    create: true
  networkPolicy:
    enabled: true
    # Label an in-cluster MCP/query pod explicitly, or use kubectl port-forward.
    queryClientSelector:
      k8s-sec-stack.io/event-sink-query: "true"
  retentionDays: 30
  storeRawEvents: false
  redactedFields:
    - output
    - output_fields.proc.cmdline
    - output_fields.proc.args
  limits:
    maxBodyBytes: 262144
    maxSnapshotBatch: 1000
    maxQueryLimit: 200
    maxQueryHours: 720
    maxQueryDays: 90
    maxTrendRecords: 1000
    maxResponseBytes: 1048576
    maxConcurrentRequests: 32

kyverno:
  enabled: true

  # --- Admission controller -------------------------------------------------
  # 3 replicas is the production minimum. The chart auto-enables a
  # PodDisruptionBudget (minAvailable: 1) when replicas > 1.
  #
  # Anti-affinity defaults to preferredDuringSchedulingIgnoredDuringExecution —
  # replicas spread across nodes where possible without hard-blocking scheduling.
  # If your cluster has dedicated security-tooling nodes, add a nodeSelector or
  # switch to requiredDuringScheduling to enforce strict separation.
  #
  # Reduce to replicas: 1 for local dev clusters with limited nodes.
  admissionController:
    replicas: 3
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  # --- Webhook failure policy -----------------------------------------------
  # forceFailurePolicyIgnore: false (default) means the webhook returns Error
  # if Kyverno is unavailable — no pod is admitted without policy evaluation.
  # This is the correct posture for production: security guarantees hold even
  # during degraded states.
  #
  # At 3 replicas, a rolling restart leaves 2 healthy pods serving the webhook,
  # so Fail policy never triggers during normal operations.
  #
  # Set enabled: true only on single-replica dev clusters where a Kyverno
  # restart would otherwise block all workload deployments.
  features:
    forceFailurePolicyIgnore:
      enabled: false

  backgroundController:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  cleanupController:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
  reportsController:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
