name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python contracts and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install MCP server and lint tooling
        run: python -m pip install ./mcp-server ruff==0.16.5

      - name: Run MCP contract tests
        run: python -m unittest discover -s mcp-server/tests -v

      - name: Run event-sink regression tests
        run: python -m unittest discover -s event-sink/tests -v

      - name: Check MCP contract and adapters
        run: |
          ruff check \
            mcp-server/src/k8s_sec_mcp/adapters \
            mcp-server/src/k8s_sec_mcp/contract.py \
            mcp-server/src/k8s_sec_mcp/models.py \
            mcp-server/src/k8s_sec_mcp/server.py \
            mcp-server/src/k8s_sec_mcp/tools/vulns.py \
            mcp-server/tests/test_contract.py \
            mcp-server/tests/test_trivy_adapter.py
          ruff format --check \
            mcp-server/src/k8s_sec_mcp/adapters \
            mcp-server/src/k8s_sec_mcp/contract.py \
            mcp-server/src/k8s_sec_mcp/models.py \
            mcp-server/src/k8s_sec_mcp/server.py \
            mcp-server/src/k8s_sec_mcp/tools/vulns.py \
            mcp-server/tests/test_contract.py \
            mcp-server/tests/test_trivy_adapter.py

  helm:
    name: Helm rendering and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Run Helm regression tests
        run: python3 -m unittest discover -s tests/helm -v

      - name: Lint umbrella chart
        run: helm lint charts/k8s-sec-stack
